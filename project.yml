name: HomeRollDesktop
options:
  bundleIdPrefix: org.homeroll
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.13"
    CURRENT_PROJECT_VERSION: "14"
targets:
  HomeRollDesktop:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Mac
      - path: Shared
      - path: Resources/Localizable.xcstrings
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: HomeRoll Desktop
        CFBundleName: HomeRoll Desktop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en]
        LSApplicationCategoryType: public.app-category.photography
        NSLocalNetworkUsageDescription: "Connects to your photo server on your home network."
        NSPhotoLibraryUsageDescription: "So new photos from Apple's Photos app can be uploaded to your own server."
        NSHumanReadableCopyright: ""
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.homeroll.desktop.local
        PRODUCT_NAME: HomeRoll Desktop Local
        PRODUCT_MODULE_NAME: HomeRollDesktop
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        # ad hoc signiert: keine Entwickler-Identität, kein Team (siehe build-app.sh)
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: org.homeroll.desktop.local.debug
          PRODUCT_NAME: HomeRoll Desktop Local

  HomeRollDesktopTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources: [Tests]
    dependencies:
      - target: HomeRollDesktop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.homeroll.desktop.local.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HomeRoll Desktop Local.app/Contents/MacOS/HomeRoll Desktop Local"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
schemes:
  HomeRollDesktop:
    build:
      targets:
        HomeRollDesktop: all
    test:
      targets: [HomeRollDesktopTests]
      environmentVariables:
        HOMEROLL_TESTING: "1"
